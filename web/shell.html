<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets us paint under the Dynamic Island and the
     home indicator while still knowing where they are, via env(safe-area-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>

<meta name="description" content="A decommissioned lock-and-dam on the Mississippi seals itself with you below grade.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<!-- Home-screen install (iOS reads the apple-* tags, not the manifest). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Is There a Way?">
<!-- The exporter injects <link rel="apple-touch-icon">, <link rel="icon"> and
     <link rel="manifest"> just below, generated from assets/icons/. -->

<style>
:root {
	--ink: #07080a;
	--sodium: #ffb054;
	--sodium-deep: #c26018;
	--dim: #6a6f78;
	--fault: #d05a4a;
	--type: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

/* Kill every browser affordance that betrays "this is a web page":
   rubber-band scroll, double-tap zoom, text selection, tap flash. */
html, body {
	margin: 0;
	padding: 0;
	position: fixed;
	inset: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background: #000;
	color: var(--dim);
	font-family: var(--type);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

#canvas {
	display: block;
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	border: 0;
	outline: none;
	touch-action: none;
	background: #000;
}

/* Probe element: env() is not readable from JS, but a computed padding is. */
#safe-probe {
	position: absolute;
	top: 0; left: 0;
	width: 0; height: 0;
	visibility: hidden;
	pointer-events: none;
	padding:
		env(safe-area-inset-top, 0px)
		env(safe-area-inset-right, 0px)
		env(safe-area-inset-bottom, 0px)
		env(safe-area-inset-left, 0px);
}

.veil {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: var(--ink);
	padding:
		calc(env(safe-area-inset-top, 0px) + 24px)
		calc(env(safe-area-inset-right, 0px) + 24px)
		calc(env(safe-area-inset-bottom, 0px) + 24px)
		calc(env(safe-area-inset-left, 0px) + 24px);
	box-sizing: border-box;
	z-index: 10;
	transition: opacity 420ms ease;
}
.veil[hidden] { display: none; }
.veil.dissolving { opacity: 0; pointer-events: none; }

/* --- title ------------------------------------------------------------- */
.title {
	font-size: clamp(15px, 3.4vw, 22px);
	letter-spacing: 0.42em;
	text-indent: 0.42em;
	color: #9aa0a8;
	text-transform: uppercase;
	font-weight: 400;
	margin: 0 0 4px;
	text-align: center;
}
.subtitle {
	font-size: 11px;
	letter-spacing: 0.3em;
	text-indent: 0.3em;
	color: #3d4249;
	margin: 0 0 40px;
	text-transform: uppercase;
	text-align: center;
}

/* --- loading ----------------------------------------------------------- */
.gauge {
	width: min(60vw, 340px);
	height: 1px;
	background: #1b1e22;
	position: relative;
	overflow: hidden;
}
.gauge__fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0%;
	background: var(--sodium-deep);
	box-shadow: 0 0 8px 1px rgba(194, 96, 24, 0.55);
	transition: width 180ms linear;
}
/* Indeterminate: some servers send no content-length. */
.gauge.unknown .gauge__fill {
	width: 34%;
	animation: sweep 1.4s ease-in-out infinite;
	transition: none;
}
@keyframes sweep {
	0%   { transform: translateX(-120%); }
	100% { transform: translateX(400%); }
}

.readout {
	width: min(60vw, 340px);
	display: flex;
	justify-content: space-between;
	font-size: 10px;
	letter-spacing: 0.22em;
	color: #464b52;
	margin-top: 12px;
	text-transform: uppercase;
}

/* --- tap gate ---------------------------------------------------------- */
#begin {
	appearance: none;
	background: none;
	border: 0;
	color: var(--sodium);
	font-family: var(--type);
	font-size: clamp(13px, 3vw, 16px);
	letter-spacing: 0.46em;
	text-indent: 0.46em;
	padding: 22px 34px;
	min-height: 44px;
	min-width: 44px;
	cursor: pointer;
	touch-action: manipulation;
	animation: breathe 3.4s ease-in-out infinite;
}
#begin:active { color: #fff; animation: none; }
@keyframes breathe {
	0%, 100% { opacity: 0.42; }
	50%      { opacity: 1; }
}
.hint {
	font-size: 10px;
	letter-spacing: 0.24em;
	color: #33383e;
	margin-top: 26px;
	text-align: center;
	line-height: 1.9;
	text-transform: uppercase;
}

/* --- fault ------------------------------------------------------------- */
#fault {
	display: none;
	max-width: 46ch;
	color: var(--fault);
	font-size: 12px;
	line-height: 1.7;
	white-space: pre-wrap;
	text-align: center;
	margin-top: 26px;
}

/* --- alerts: update banner and error toasts, one column ----------------- */
#alerts {
	position: absolute;
	top: calc(env(safe-area-inset-top, 0px) + 8px);
	left: 50%;
	transform: translateX(-50%);
	z-index: 15;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 8px;
	width: min(76vw, 620px);
	/* The column spans the middle of the screen; only its children may take
	   touches, or it would swallow half the look gestures. */
	pointer-events: none;
}
#alerts > *, #toasts > * { pointer-events: auto; }
#toasts {
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: 6px;
	width: 100%;
}

#update {
	appearance: none;
	border: 1px solid rgba(255, 176, 84, 0.45);
	border-radius: 3px;
	background: rgba(7, 8, 10, 0.94);
	color: var(--sodium);
	font-family: var(--type);
	font-size: 10px;
	letter-spacing: 0.22em;
	text-transform: uppercase;
	padding: 13px 18px;
	min-height: 44px;
	cursor: pointer;
	touch-action: manipulation;
}
#update[hidden] { display: none; }
#update:active { color: #fff; }

/* --- error toasts ------------------------------------------------------- */
.toast {
	box-sizing: border-box;
	display: flex;
	align-items: center;
	gap: 10px;
	border: 1px solid rgba(208, 90, 74, 0.5);
	border-left-width: 3px;
	border-radius: 3px;
	background: rgba(11, 8, 8, 0.95);
	color: #e3aca2;
	font-size: 12px;
	line-height: 1.5;
	padding: 10px 12px;
	min-height: 44px;
	max-height: 7.5em;
	overflow: hidden;
	cursor: pointer;
	text-align: left;
	word-break: break-word;
}
.toast--note {
	border-color: rgba(255, 176, 84, 0.4);
	color: #d7b184;
	background: rgba(9, 9, 10, 0.95);
}
/* Set when the clipboard refused us, so the text can be selected by hand. */
.toast--select {
	-webkit-user-select: text;
	user-select: text;
	white-space: pre-wrap;
	max-height: 12em;
	overflow: auto;
}
.toast__msg { flex: 1 1 auto; }
.toast__count { flex: 0 0 auto; font-size: 10px; opacity: 0.65; }
.toast__x { flex: 0 0 auto; font-size: 15px; opacity: 0.5; }

/* --- build stamp -------------------------------------------------------- */
/* pointer-events:none on purpose -- boot.js recognises the tap by geometry so
   this never eats a stick drag that starts in the corner. */
#stamp {
	position: absolute;
	top: calc(env(safe-area-inset-top, 0px) + 8px);
	left: calc(env(safe-area-inset-left, 0px) + 10px);
	z-index: 14;
	pointer-events: none;
	border: 1px solid rgba(122, 130, 140, 0.3);
	border-radius: 3px;
	background: rgba(7, 8, 10, 0.6);
	color: #98a1ac;
	font-family: var(--type);
	font-size: 13px;
	letter-spacing: 0.06em;
	padding: 0 12px;
	min-height: 44px;
	display: inline-flex;
	align-items: center;
}
#stamp[hidden] { display: none; }

/* --- orientation ------------------------------------------------------- */
#rotate {
	position: absolute;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 26px;
	background: #000;
	text-align: center;
	padding: 24px;
}
@media (orientation: portrait) and (max-width: 900px) {
	#rotate { display: flex; }
}
.phone {
	width: 46px;
	height: 78px;
	border: 1.5px solid #4a5058;
	border-radius: 8px;
	animation: turn 2.6s ease-in-out infinite;
}
@keyframes turn {
	0%, 30%   { transform: rotate(0deg); }
	55%, 100% { transform: rotate(-90deg); }
}
.rotate__text {
	font-size: 11px;
	letter-spacing: 0.3em;
	color: #6a6f78;
	text-transform: uppercase;
	line-height: 2;
}

@media (prefers-reduced-motion: reduce) {
	#begin, .phone, .gauge.unknown .gauge__fill { animation: none; }
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<div id="safe-probe"></div>
<canvas id="canvas">Your browser does not support the canvas element.</canvas>

<div class="veil" id="veil">
	<h1 class="title">Is There a Way?</h1>
	<p class="subtitle">Lock &amp; Dam 26 &middot; Structural Audit</p>

	<div id="loading">
		<div class="gauge unknown" id="gauge"><div class="gauge__fill" id="gauge-fill"></div></div>
		<div class="readout">
			<span id="readout-label">Descending</span>
			<span id="readout-value"></span>
		</div>
	</div>

	<button id="begin" type="button" hidden>Tap to Begin</button>
	<p class="hint" id="hint" hidden>Headphones recommended<br>Landscape &middot; Rotate lock on</p>
	<pre id="fault"></pre>
</div>

<!-- Tap to copy the full build report. Three-finger tap opens the in-game
     debug overlay; see src/ui/debug_overlay.gd. -->
<div id="stamp" hidden></div>

<div id="alerts">
	<button id="update" type="button" hidden>New version &mdash; tap to reload</button>
	<div id="toasts"></div>
</div>

<div id="rotate">
	<div class="phone"></div>
	<div class="rotate__text">Rotate to landscape</div>
</div>

<noscript><p style="color:#888;font-family:monospace;padding:2rem">This game requires JavaScript.</p></noscript>

<script src="$GODOT_URL"></script>
<script>
// The exporter substitutes these two tokens in this file only, so they are
// captured here and read by boot.js below.
window.GODOT_CONFIG = $GODOT_CONFIG;
window.GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
</script>
<script>
/* $ITAW_BOOT */
</script>
</body>
</html>
