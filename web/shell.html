<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets us paint under the Dynamic Island and the
     home indicator while still knowing where they are, via env(safe-area-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>

<meta name="description" content="A decommissioned lock-and-dam on the Mississippi seals itself with you below grade.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<!-- Home-screen install (iOS reads the apple-* tags, not the manifest). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Is There a Way?">
<!-- The exporter injects <link rel="apple-touch-icon">, <link rel="icon"> and
     <link rel="manifest"> just below, generated from assets/icons/. -->

<style>
:root {
	--ink: #07080a;
	--sodium: #ffb054;
	--sodium-deep: #c26018;
	--dim: #6a6f78;
	--fault: #d05a4a;
	--type: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

/* Kill every browser affordance that betrays "this is a web page":
   rubber-band scroll, double-tap zoom, text selection, tap flash. */
html, body {
	margin: 0;
	padding: 0;
	position: fixed;
	inset: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background: #000;
	color: var(--dim);
	font-family: var(--type);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

#canvas {
	display: block;
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	border: 0;
	outline: none;
	touch-action: none;
	background: #000;
}

/* Probe element: env() is not readable from JS, but a computed padding is. */
#safe-probe {
	position: absolute;
	top: 0; left: 0;
	width: 0; height: 0;
	visibility: hidden;
	pointer-events: none;
	padding:
		env(safe-area-inset-top, 0px)
		env(safe-area-inset-right, 0px)
		env(safe-area-inset-bottom, 0px)
		env(safe-area-inset-left, 0px);
}

.veil {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: var(--ink);
	padding:
		calc(env(safe-area-inset-top, 0px) + 24px)
		calc(env(safe-area-inset-right, 0px) + 24px)
		calc(env(safe-area-inset-bottom, 0px) + 24px)
		calc(env(safe-area-inset-left, 0px) + 24px);
	box-sizing: border-box;
	z-index: 10;
	transition: opacity 420ms ease;
}
.veil[hidden] { display: none; }
.veil.dissolving { opacity: 0; pointer-events: none; }

/* --- title ------------------------------------------------------------- */
.title {
	font-size: clamp(15px, 3.4vw, 22px);
	letter-spacing: 0.42em;
	text-indent: 0.42em;
	color: #9aa0a8;
	text-transform: uppercase;
	font-weight: 400;
	margin: 0 0 4px;
	text-align: center;
}
.subtitle {
	font-size: 11px;
	letter-spacing: 0.3em;
	text-indent: 0.3em;
	color: #3d4249;
	margin: 0 0 40px;
	text-transform: uppercase;
	text-align: center;
}

/* --- loading ----------------------------------------------------------- */
.gauge {
	width: min(60vw, 340px);
	height: 1px;
	background: #1b1e22;
	position: relative;
	overflow: hidden;
}
.gauge__fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0%;
	background: var(--sodium-deep);
	box-shadow: 0 0 8px 1px rgba(194, 96, 24, 0.55);
	transition: width 180ms linear;
}
/* Indeterminate: some servers send no content-length. */
.gauge.unknown .gauge__fill {
	width: 34%;
	animation: sweep 1.4s ease-in-out infinite;
	transition: none;
}
@keyframes sweep {
	0%   { transform: translateX(-120%); }
	100% { transform: translateX(400%); }
}

.readout {
	width: min(60vw, 340px);
	display: flex;
	justify-content: space-between;
	font-size: 10px;
	letter-spacing: 0.22em;
	color: #464b52;
	margin-top: 12px;
	text-transform: uppercase;
}

/* --- tap gate ---------------------------------------------------------- */
#begin {
	appearance: none;
	background: none;
	border: 0;
	color: var(--sodium);
	font-family: var(--type);
	font-size: clamp(13px, 3vw, 16px);
	letter-spacing: 0.46em;
	text-indent: 0.46em;
	padding: 22px 34px;
	min-height: 44px;
	min-width: 44px;
	cursor: pointer;
	touch-action: manipulation;
	animation: breathe 3.4s ease-in-out infinite;
}
#begin:active { color: #fff; animation: none; }
@keyframes breathe {
	0%, 100% { opacity: 0.42; }
	50%      { opacity: 1; }
}
.hint {
	font-size: 10px;
	letter-spacing: 0.24em;
	color: #33383e;
	margin-top: 26px;
	text-align: center;
	line-height: 1.9;
	text-transform: uppercase;
}

/* --- fault ------------------------------------------------------------- */
#fault {
	display: none;
	max-width: 46ch;
	color: var(--fault);
	font-size: 12px;
	line-height: 1.7;
	white-space: pre-wrap;
	text-align: center;
	margin-top: 26px;
}

/* --- orientation ------------------------------------------------------- */
#rotate {
	position: absolute;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 26px;
	background: #000;
	text-align: center;
	padding: 24px;
}
@media (orientation: portrait) and (max-width: 900px) {
	#rotate { display: flex; }
}
.phone {
	width: 46px;
	height: 78px;
	border: 1.5px solid #4a5058;
	border-radius: 8px;
	animation: turn 2.6s ease-in-out infinite;
}
@keyframes turn {
	0%, 30%   { transform: rotate(0deg); }
	55%, 100% { transform: rotate(-90deg); }
}
.rotate__text {
	font-size: 11px;
	letter-spacing: 0.3em;
	color: #6a6f78;
	text-transform: uppercase;
	line-height: 2;
}

@media (prefers-reduced-motion: reduce) {
	#begin, .phone, .gauge.unknown .gauge__fill { animation: none; }
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<div id="safe-probe"></div>
<canvas id="canvas">Your browser does not support the canvas element.</canvas>

<div class="veil" id="veil">
	<h1 class="title">Is There a Way?</h1>
	<p class="subtitle">Lock &amp; Dam 26 &middot; Structural Audit</p>

	<div id="loading">
		<div class="gauge unknown" id="gauge"><div class="gauge__fill" id="gauge-fill"></div></div>
		<div class="readout">
			<span id="readout-label">Descending</span>
			<span id="readout-value"></span>
		</div>
	</div>

	<button id="begin" type="button" hidden>Tap to Begin</button>
	<p class="hint" id="hint" hidden>Headphones recommended<br>Landscape &middot; Rotate lock on</p>
	<pre id="fault"></pre>
</div>

<div id="rotate">
	<div class="phone"></div>
	<div class="rotate__text">Rotate to landscape</div>
</div>

<noscript><p style="color:#888;font-family:monospace;padding:2rem">This game requires JavaScript.</p></noscript>

<script src="$GODOT_URL"></script>
<script>
(function () {
	'use strict';

	// ---- safe-area bridge --------------------------------------------------
	// Godot cannot see env(safe-area-inset-*), so we publish it. Returns
	// "top,right,bottom,left" in CSS pixels; see src/ui/safe_area_margin.gd.
	var probe = document.getElementById('safe-probe');
	window.__itaw_safeArea = function () {
		try {
			var s = getComputedStyle(probe);
			return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft]
				.map(function (v) { return parseFloat(v) || 0; })
				.join(',');
		} catch (e) {
			return '0,0,0,0';
		}
	};

	// ---- elements ----------------------------------------------------------
	var canvasEl = document.getElementById('canvas');
	var veil = document.getElementById('veil');
	var loading = document.getElementById('loading');
	var gauge = document.getElementById('gauge');
	var gaugeFill = document.getElementById('gauge-fill');
	var readoutLabel = document.getElementById('readout-label');
	var readoutValue = document.getElementById('readout-value');
	var beginBtn = document.getElementById('begin');
	var hint = document.getElementById('hint');
	var fault = document.getElementById('fault');

	// ---- browser affordances we never want ---------------------------------
	// Pinch/double-tap zoom. iOS ignores user-scalable=no in some contexts.
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
		document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
	});
	// Rubber-band scrolling anywhere that is not the canvas (the canvas has
	// touch-action:none, so the browser never tries to scroll from it).
	document.addEventListener('touchmove', function (e) {
		if (e.target !== canvasEl) { e.preventDefault(); }
	}, { passive: false });
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
	// Belt-and-braces double-tap suppression for older WebKit.
	var lastTouchEnd = 0;
	document.addEventListener('touchend', function (e) {
		var now = Date.now();
		if (now - lastTouchEnd <= 300) { e.preventDefault(); }
		lastTouchEnd = now;
	}, { passive: false });

	function showFault(err) {
		console.error(err);
		loading.style.display = 'none';
		beginBtn.hidden = true;
		hint.hidden = true;
		fault.style.display = 'block';
		fault.textContent = (err && err.message) ? err.message : String(err);
	}

	// ---- engine ------------------------------------------------------------
	var GODOT_CONFIG = $GODOT_CONFIG;
	var GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

	var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showFault(new Error('This browser is missing:\n' + missing.join('\n')));
		return;
	}

	GODOT_CONFIG['onProgress'] = function (current, total) {
		if (total > 0) {
			gauge.classList.remove('unknown');
			var pct = Math.max(0, Math.min(100, (current / total) * 100));
			gaugeFill.style.width = pct.toFixed(1) + '%';
			readoutValue.textContent = pct.toFixed(0) + '%';
		} else {
			gauge.classList.add('unknown');
			readoutValue.textContent = '';
		}
	};

	var engine = new Engine(GODOT_CONFIG);
	var exe = GODOT_CONFIG['executable'];
	var pack = GODOT_CONFIG['mainPack'] || (exe + '.pck');

	// Load everything up front, but do NOT start. Godot builds its AudioContext
	// during start(), and Safari only lets that context begin running if it is
	// created inside a user gesture -- so start() has to happen under the tap.
	// init() must come first: it is what installs the progress callback.
	var loaded = engine.init(exe).then(function () {
		return engine.preloadFile(pack, pack);
	});

	loaded.then(function () {
		gauge.classList.remove('unknown');
		gaugeFill.style.width = '100%';
		readoutLabel.textContent = 'Ready';
		readoutValue.textContent = '';
		loading.style.display = 'none';
		beginBtn.hidden = false;
		hint.hidden = false;
	}).catch(showFault);

	var started = false;
	function begin() {
		if (started) { return; }
		started = true;

		// Nudge WebKit's audio unlock heuristics inside the gesture, then let
		// Godot build its own context in the same turn.
		try {
			var AC = window.AudioContext || window.webkitAudioContext;
			if (AC) {
				var probeCtx = new AC();
				var src = probeCtx.createBufferSource();
				src.buffer = probeCtx.createBuffer(1, 1, 22050);
				src.connect(probeCtx.destination);
				src.start(0);
				probeCtx.resume();
			}
		} catch (e) { /* not fatal: the game is playable muted */ }

		veil.classList.add('dissolving');
		engine.start({
			'args': ['--main-pack', pack].concat(GODOT_CONFIG['args'] || [])
		}).then(function () {
			window.setTimeout(function () { veil.hidden = true; }, 460);
			canvasEl.focus();
		}).catch(function (err) {
			veil.classList.remove('dissolving');
			showFault(err);
		});
	}

	beginBtn.addEventListener('click', begin);
	// Touch first: on iOS, click lags a touch by enough to lose the gesture.
	beginBtn.addEventListener('touchend', function (e) { e.preventDefault(); begin(); }, { passive: false });
}());
</script>
</body>
</html>
