name: build and deploy

# Phase 0's whole point: a commit here becomes a URL the phone can open, with
# no desktop in the loop. Everything below is reproducible from the repo --
# the engine is pinned, the templates are fetched by a committed script, and
# the export is smoke-tested in a headless browser before it is allowed out.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.6.3-stable"
  CLOUDFLARE_PROJECT: "is-there-a-way"

jobs:
  # Secrets are not readable from a job-level `if:`, so surface their presence
  # as an output instead.
  probe:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present: will deploy to Pages via wrangler."
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare credentials: GitHub Pages is the live URL. See docs/DEPLOY.md."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-sdk
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Fetch Godot and the Web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/fetch_godot.py --version "$GODOT_VERSION" --dest .godot-sdk

      - name: Verify the engine is exactly the pinned version
        run: |
          set -euo pipefail
          ACTUAL="$(.godot-sdk/godot --headless --version | tail -1)"
          EXPECTED="${GODOT_VERSION/-/.}"
          echo "engine: $ACTUAL"
          case "$ACTUAL" in
            "$EXPECTED".*) ;;
            *) echo "error: engine is $ACTUAL, expected $EXPECTED.*" >&2; exit 1 ;;
          esac
          test -f "$HOME/.local/share/godot/export_templates/$EXPECTED/web_nothreads_release.zip" \
            || { echo "error: single-threaded web release template missing" >&2; exit 1; }

      - name: Build the web export
        run: GODOT="$PWD/.godot-sdk/godot" bash tools/ci/build_web.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test tooling
        working-directory: tools/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test the export in a headless browser
        run: node tools/web/smoke_web.js build build-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: build-smoke
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Primary target. Runs only once the two repository secrets exist.
  deploy-cloudflare:
    needs: [probe, build]
    if: needs.probe.outputs.cloudflare == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build
      - working-directory: tools/web
        run: npm ci --no-audit --no-fund
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: tools/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages project create "$CLOUDFLARE_PROJECT" \
            --production-branch main 2>/dev/null || echo "project already exists"
          npx wrangler pages deploy ../../build \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch main \
            --commit-dirty=true | tee deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Live on Cloudflare: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Fallback, and a permanently useful second URL. Free on a public repo, but
  # it has to be switched on by hand once: GITHUB_TOKEN is not allowed to create
  # a Pages site, whatever permissions the workflow asks for. So probe first and
  # print instructions instead of failing red every push.
  deploy-pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages switched on?
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## GitHub Pages is not switched on yet"
              echo
              echo "The build is green and the site is ready; it just has nowhere to go."
              echo "One-time switch, about four taps:"
              echo
              echo "1. Repo → **Settings** → **Pages**"
              echo "2. Under *Build and deployment*, set **Source** to **GitHub Actions**"
              echo "3. Come back here and **Re-run all jobs**"
              echo
              echo "The site will then be at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
              echo
              echo "Cloudflare Pages is the primary target and needs no Pages switch — see \`docs/DEPLOY.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - id: deploy
        if: steps.state.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - if: steps.state.outputs.enabled == 'true'
        run: |
          echo "## Live on GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
