name: build and deploy

# Phase 0's whole point: a commit here becomes a URL the phone can open, with
# no desktop in the loop. Everything below is reproducible from the repo --
# the engine is pinned, the templates are fetched by a committed script, and
# the export is smoke-tested in a headless browser before it is allowed out.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.6.3-stable"
  CLOUDFLARE_PROJECT: "is-there-a-way"

jobs:
  # Everything the deploy jobs are allowed to know before they decide, resolved
  # once and published as outputs. Secrets are not readable from a job-level
  # `if:`, and neither -- reliably -- is the event payload; see below.
  probe:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.secrets.outputs.cloudflare }}
      default_branch: ${{ steps.branch.outputs.default_branch }}
      is_default: ${{ steps.branch.outputs.is_default }}
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      # Ask GitHub what the default branch is *now*. The obvious expression --
      # `github.event.repository.default_branch` -- reads a snapshot taken when
      # the event was created, and that snapshot goes stale in two ways that
      # both bit us: a re-run replays the original event's payload, and the push
      # event a branch rename produces can still carry the name the branch had
      # before the rename. Run #13 was a genuine `push` to `main` whose deploy
      # jobs skipped for exactly that reason -- `github.ref_name` was `main` and
      # the payload disagreed. An API call cannot be stale.
      - id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEFAULT="$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["default_branch"])')"
          IS_DEFAULT=false
          [ "${{ github.ref_name }}" = "$DEFAULT" ] && IS_DEFAULT=true
          echo "default_branch=$DEFAULT" >> "$GITHUB_OUTPUT"
          echo "is_default=$IS_DEFAULT" >> "$GITHUB_OUTPUT"
          # Printed every run, so a deploy that does not happen always says why.
          {
            echo "### Deploy gate"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` (attempt ${{ github.run_attempt }}) |"
            echo "| ref_name | \`${{ github.ref_name }}\` |"
            echo "| default branch, live from the API | \`$DEFAULT\` |"
            echo "| default branch, from the event payload | \`${{ github.event.repository.default_branch }}\` |"
            echo "| **publishes** | **$IS_DEFAULT** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not switched on (API returned $CODE)."
          fi

      - id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present: will deploy to Pages via wrangler."
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare credentials: GitHub Pages is the live URL. See docs/DEPLOY.md."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-sdk
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Fetch Godot and the Web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/fetch_godot.py --version "$GODOT_VERSION" --dest .godot-sdk

      - name: Verify the engine is exactly the pinned version
        run: |
          set -euo pipefail
          ACTUAL="$(.godot-sdk/godot --headless --version | tail -1)"
          EXPECTED="${GODOT_VERSION/-/.}"
          echo "engine: $ACTUAL"
          case "$ACTUAL" in
            "$EXPECTED".*) ;;
            *) echo "error: engine is $ACTUAL, expected $EXPECTED.*" >&2; exit 1 ;;
          esac
          test -f "$HOME/.local/share/godot/export_templates/$EXPECTED/web_nothreads_release.zip" \
            || { echo "error: single-threaded web release template missing" >&2; exit 1; }

      - name: Build the web export
        run: GODOT="$PWD/.godot-sdk/godot" bash tools/ci/build_web.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test tooling
        working-directory: tools/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test the export in a headless browser
        run: node tools/web/smoke_web.js build build-smoke

      # Separate suite, separate failure mode: this one installs the service
      # worker, lands a forged rebuild under the running client, serves a stale
      # document, and proves ?fresh=1 gets back out. See docs/TESTING.md.
      - name: Smoke test the update path
        run: node tools/web/smoke_pwa.js build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: build-smoke
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Primary target. Runs only once the two repository secrets exist.
  deploy-cloudflare:
    needs: [probe, build]
    # A hosted site has one live version; a feature branch that quietly
    # overwrote it would be worse than no deploy.
    if: needs.probe.outputs.cloudflare == 'true' && needs.probe.outputs.is_default == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build
      - working-directory: tools/web
        run: npm ci --no-audit --no-fund
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: tools/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The Cloudflare "branch" is deliberately the constant `production`,
          # not the git branch name: this job only runs on the repository's
          # default branch, so every deploy here IS production, and a git branch
          # name containing a slash would otherwise land as a preview deploy at
          # an unpredictable URL.
          npx wrangler pages project create "$CLOUDFLARE_PROJECT" \
            --production-branch production 2>/dev/null || echo "project already exists"
          npx wrangler pages deploy ../../build \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch production \
            --commit-dirty=true | tee deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Live on Cloudflare: $URL" >> "$GITHUB_STEP_SUMMARY"

  # The live URL until Cloudflare credentials exist. No `continue-on-error`:
  # a deploy that fails on the default branch is a red build, because the whole
  # point of this pipeline is that a commit becomes a URL.
  #
  # No `environment:` block, deliberately. Declaring one makes Actions evaluate
  # the github-pages environment's deployment-branch policy before the job even
  # starts, and that policy was written when Pages was switched on -- naming the
  # branch that was default at the time. Renaming the branch does not update it,
  # so the job was rejected outright with "Branch \"main\" is not allowed to
  # deploy to github-pages due to environment protection rules", before a single
  # step ran. The deployment still lands in that environment; we just stop
  # asking Actions to pre-approve it. The cost is the environment URL on the run
  # page, which the verify job prints anyway.
  deploy-pages:
    needs: [probe, build]
    if: needs.probe.outputs.is_default == 'true'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: GitHub Pages has to be switched on by hand, once
        if: needs.probe.outputs.pages != 'true'
        run: |
          {
            echo "## GitHub Pages is not switched on"
            echo
            echo "The build is green and the site is ready; it has nowhere to go."
            echo "GITHUB_TOKEN cannot create a Pages site whatever permissions"
            echo "this workflow requests, so this is the one manual step:"
            echo
            echo "1. Repo → **Settings** → **Pages**"
            echo "2. *Build and deployment* → **Source** → **GitHub Actions**"
            echo "3. Come back here and **Re-run all jobs**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "error: GitHub Pages is not enabled for this repository." >&2
          exit 1

      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: |
          echo "### Live on GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  # A deploy that silently did not happen used to look exactly like a green
  # build. This is the job that makes that impossible.
  verify:
    needs: [probe, build, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A deploy can be refused by things no step of ours can see. Say what,
      # with status codes, rather than leaving a bare "failure".
      - name: Why the deploy did not happen
        if: needs.probe.outputs.is_default == 'true' && needs.deploy-pages.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -uo pipefail
          api() {
            curl -sS -o /tmp/body.json -w '%{http_code}' \
              -X "$1" -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$2" ${3:+-d "$3"}
          }
          ENV_URL="https://api.github.com/repos/${{ github.repository }}/environments/github-pages"
          CODE="$(api GET "$ENV_URL")"
          echo "GET  environments/github-pages -> $CODE"
          head -c 800 /tmp/body.json; echo
          CODE="$(api GET "$ENV_URL/deployment-branch-policies")"
          echo "GET  deployment-branch-policies -> $CODE"
          head -c 800 /tmp/body.json; echo
          # GITHUB_TOKEN cannot hold `administration: write` -- it is not a
          # requestable workflow permission -- so this is expected to be
          # refused. Recorded so the refusal is quoted rather than described.
          CODE="$(api POST "$ENV_URL/deployment-branch-policies" '{"name":"main","type":"branch"}')"
          echo "POST deployment-branch-policies {main} -> $CODE"
          head -c 800 /tmp/body.json; echo

      - name: On the default branch, the deploy must have run
        run: |
          set -euo pipefail
          echo "is_default=${{ needs.probe.outputs.is_default }}"
          echo "deploy-pages=${{ needs.deploy-pages.result }}"
          if [ "${{ needs.probe.outputs.is_default }}" != "true" ]; then
            echo "Not the default branch (${{ github.ref_name }} != ${{ needs.probe.outputs.default_branch }}); nothing should publish."
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build did not succeed; the deploy was correctly not attempted." >&2
            exit 1
          fi
          if [ "${{ needs.deploy-pages.result }}" != "success" ]; then
            echo "error: on the default branch deploy-pages must run and succeed." >&2
            echo "       It was '${{ needs.deploy-pages.result }}'. See the Deploy gate table" >&2
            echo "       in the probe job's summary for what the gate actually saw." >&2
            exit 1
          fi

      - name: And the published site must answer
        if: needs.probe.outputs.is_default == 'true' && needs.deploy-pages.result == 'success'
        run: bash tools/ci/verify_live.sh "${{ needs.deploy-pages.outputs.page_url }}" "${{ github.sha }}"
