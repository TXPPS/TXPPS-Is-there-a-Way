[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="build_stamp.json"
exclude_filter="web/*, build/*, build-smoke/*, tools/*, tests/*, node_modules/*, docs/*"
export_path="build/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Single-threaded: no SharedArrayBuffer, so no COOP/COEP requirement and no
; cross-origin isolation. This is the only variant that loads on iOS Safari
; from a plain static host.
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
; 2 = Adaptive: the canvas tracks the window, which is what we want under
; rotation and when Safari's chrome collapses on scroll.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
; MUST stay false. The service worker would otherwise inject COOP/COEP headers
; to enable SharedArrayBuffer, which we neither need nor want single-threaded.
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page="res://web/offline.html"
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/icons/icon_144.png"
progressive_web_app/icon_180x180="res://assets/icons/icon_180.png"
progressive_web_app/icon_512x512="res://assets/icons/icon_512.png"
progressive_web_app/background_color=Color(0, 0, 0, 1)
